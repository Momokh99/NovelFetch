name: Release TUI App

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build TUI binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --console --name novelfetch --add-data "novelfetch.tcss:." main.py
        shell: bash

      - name: Build TUI binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --console --name novelfetch --add-data "novelfetch.tcss;." main.py
        shell: bash

      - name: Archive Linux/macOS binary
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czvf ../novelfetch-${{ runner.os }}-x64.tar.gz novelfetch
        shell: bash

      - name: Archive Windows binary
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path novelfetch.exe -DestinationPath ..\novelfetch-Windows-x64.zip
        shell: powershell

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            novelfetch-*.tar.gz
            novelfetch-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
