name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload wheel + sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  desktop:
    name: Windows binaries (TUI + GUI)
    needs: wheel
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ".[gui]"

      - name: Build TUI binary (PyInstaller)
        run: pyinstaller --clean --noconfirm packaging/novelfetch-tui.spec

      - name: Build GUI binary (PyInstaller)
        run: pyinstaller --clean --noconfirm packaging/novelfetch-gui.spec

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.exe
          if-no-files-found: error

  appimage:
    name: Linux AppImages (TUI + GUI)
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # mksquashfs is required to package AppImages but is not present on
          # the default ubuntu-latest image. libcairo2-dev is needed to build
          # pycairo (a transitive dep of kivy) from source inside the AppDir.
          sudo apt-get install -y squashfs-tools file libfuse2 libcairo2-dev

      - name: Install python-appimage
        run: python -m pip install --upgrade pip python-appimage

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel

      - name: Stage wheel into recipes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WHEEL=$(find wheel -name '*.whl' | head -1)
          for variant in tui gui; do
            mkdir -p "packaging/appimage/$variant"
            cp "$WHEEL" "packaging/appimage/$variant/"
            # python-appimage pip-installs from a temp dir, so reference the
            # wheel by absolute path; keep the PEP 427 filename (renaming would
            # make pip reject it). The [extra] pulls the variant dependencies.
            ABS="$(realpath "packaging/appimage/$variant/$(basename "$WHEEL")")"
            printf '%s[%s]\n' "$ABS" "$variant" > "packaging/appimage/$variant/requirements.txt"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build TUI AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 python -m python_appimage build app -p 3.11 packaging/appimage/tui

      - name: Build GUI AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 python -m python_appimage build app -p 3.11 packaging/appimage/gui

      - name: Rename AppImages to versioned names
        run: |
          mkdir -p dist
          cp packaging/appimage/tui/*-x86_64.AppImage "dist/novelfetch-tui-$VERSION.AppImage" 2>/dev/null || true
          cp packaging/appimage/gui/*-x86_64.AppImage "dist/novelfetch-gui-$VERSION.AppImage" 2>/dev/null || true
          ls -la dist

      - name: Upload AppImages
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev automake autopoint gettext

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.34

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (buildozer)
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: bin/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [wheel, desktop, appimage, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
