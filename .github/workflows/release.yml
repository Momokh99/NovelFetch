name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve and validate version
        # On tag pushes this fails the release if the tag disagrees with
        # pyproject.toml / buildozer.spec. On manual dispatch it falls back to
        # the pyproject version as the single source of truth.
        id: version
        run: echo "version=$(python packaging/release.py --check)" >> "$GITHUB_OUTPUT"

  wheel:
    name: Build wheel + sdist
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/novelfetch-venv
          /tmp/novelfetch-venv/bin/pip install --quiet dist/*.whl
          /tmp/novelfetch-venv/bin/python -c \
            "from sources import REGISTRY; assert len(REGISTRY) == 3, f'got {len(REGISTRY)} sources'"
          echo "wheel installs and imports cleanly"

      - name: Upload wheel + sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Windows binaries (TUI + GUI)
    needs: [validate]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TUI dependencies
        # Build the TUI first with only TUI deps installed. Installing .[gui]
        # would pull in kivy, whose PyInstaller hook initializes an OpenGL
        # context at build time and crashes headless Windows runners (GL 1.1).
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ".[tui]"

      - name: Build TUI binary (PyInstaller)
        run: pyinstaller --clean --noconfirm packaging/novelfetch-tui.spec

      - name: Smoke test TUI binary
        shell: bash
        run: |
          set +e
          timeout 20 ./dist/novelfetch-tui.exe </dev/null >"$TEMP/tui-smoke.log" 2>&1
          rc=$?
          if [ $rc -eq 124 ] || [ $rc -eq 0 ] || ! grep -q "Traceback" "$TEMP/tui-smoke.log"; then
            echo "TUI binary passed the smoke test (rc=$rc)"
          else
            echo "TUI binary crashed at startup:"; cat "$TEMP/tui-smoke.log"; exit 1
          fi

      - name: Install GUI dependencies
        run: pip install ".[gui]"

      - name: Build GUI binary (PyInstaller)
        # KIVY_GL_BACKEND=mock makes collect_all("kivymd")'s isolated subprocess
        # skip the real OpenGL initialization. The runner only has GDI OpenGL
        # 1.1 (Microsoft Basic Renderer), and the real backend aborts on the
        # "minimum 2.0 required" check. Do NOT set SDL_VIDEODRIVER=dummy here:
        # the dummy SDL driver has no GL context at all, which fails earlier.
        env:
          KIVY_GL_BACKEND: mock
        run: pyinstaller --clean --noconfirm packaging/novelfetch-gui.spec

      - name: Smoke test GUI binary
        # No guaranteed display on this runner, so a startup crash is reported
        # but does not fail the release.
        shell: bash
        run: |
          set +e
          timeout 20 ./dist/novelfetch-gui.exe </dev/null >"$TEMP/gui-smoke.log" 2>&1
          rc=$?
          if [ $rc -eq 124 ] || [ $rc -eq 0 ] || ! grep -q "Traceback" "$TEMP/gui-smoke.log"; then
            echo "GUI binary passed the smoke test (rc=$rc)"
          else
            echo "GUI binary reported a crash (non-blocking):"; cat "$TEMP/gui-smoke.log"
          fi

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.exe
          if-no-files-found: error

  appimage:
    name: Linux AppImage (GUI)
    needs: [validate, wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # mksquashfs is required to package AppImages but is not present on
          # the default ubuntu-latest image. libcairo2-dev is needed to build
          # pycairo (a transitive dep of kivy) from source inside the AppDir.
          # xvfb drives the post-build smoke test headlessly.
          sudo apt-get install -y squashfs-tools file libfuse2 libcairo2-dev xvfb

      - name: Install python-appimage
        run: python -m pip install --upgrade pip python-appimage

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel

      - name: Stage wheel into recipe
        run: |
          WHEEL=$(find wheel -name '*.whl' | head -1)
          mkdir -p "packaging/appimage/gui"
          cp "$WHEEL" "packaging/appimage/gui/"
          # python-appimage pip-installs from a temp dir, so reference the
          # wheel by absolute path; keep the PEP 427 filename (renaming would
          # make pip reject it). The [extra] pulls the variant dependencies.
          ABS="$(realpath "packaging/appimage/gui/$(basename "$WHEEL")")"
          printf '%s[%s]\n' "$ABS" gui > "packaging/appimage/gui/requirements.txt"

      - name: Build GUI AppImage
        # python-appimage writes the resulting AppImage to the repo root (CWD),
        # named after the desktop file's Name= field (NovelFetch-x86_64.AppImage).
        run: APPIMAGE_EXTRACT_AND_RUN=1 python -m python_appimage build app -p 3.11 packaging/appimage/gui

      - name: Rename AppImage to versioned name
        run: |
          mkdir -p dist
          cp NovelFetch-*.AppImage "dist/novelfetch-gui-${{ needs.validate.outputs.version }}.AppImage"
          ls -la dist

      - name: Smoke test GUI AppImage
        # APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE in CI; xvfb + software
        # GL give Kivy a usable (llvmpipe) context headlessly.
        run: |
          set +e
          APP=$(ls dist/novelfetch-gui-*.AppImage | head -1)
          timeout 40 env APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            env LIBGL_ALWAYS_SOFTWARE=1 "$APP" </dev/null >/tmp/gui-smoke.log 2>&1
          rc=$?
          if [ $rc -eq 124 ] || [ $rc -eq 0 ] || ! grep -q "Traceback" /tmp/gui-smoke.log; then
            echo "GUI AppImage passed the smoke test (rc=$rc)"
          else
            echo "GUI AppImage crashed at startup:"; cat /tmp/gui-smoke.log; exit 1
          fi

      - name: Upload AppImages
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  linux-tui:
    name: Linux TUI binary
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ".[tui]"

      - name: Build TUI binary (PyInstaller)
        run: pyinstaller --clean --noconfirm packaging/novelfetch-tui.spec

      - name: Rename binary for terminal invocation
        # Named so it can be run from the terminal by typing NovelFetchTUI.
        run: mv dist/novelfetch-tui "dist/NovelFetchTUI-${{ needs.validate.outputs.version }}"

      - name: Smoke test TUI binary
        run: |
          set +e
          BIN=$(find dist -name 'NovelFetchTUI-*' | head -1)
          timeout 20 "$BIN" </dev/null >/tmp/tui-smoke.log 2>&1
          rc=$?
          if [ $rc -eq 124 ] || [ $rc -eq 0 ] || ! grep -q "Traceback" /tmp/tui-smoke.log; then
            echo "TUI binary passed the smoke test (rc=$rc)"
          else
            echo "TUI binary crashed at startup:"; cat /tmp/tui-smoke.log; exit 1
          fi

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-tui
          path: dist/NovelFetchTUI-*
          if-no-files-found: error

  android:
    name: Android debug APK
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            libtool-bin autoconf-archive libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev autopoint gettext ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade 'pip<26'
          pip install --upgrade buildozer cython==0.29.34

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          # buildozer.spec embeds `version`, so a release bump changes the key;
          # restore-keys lets the last SDK/NDK/toolchain cache survive the bump
          # instead of forcing a ~3.4GB re-download.
          restore-keys: buildozer-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ hashFiles('buildozer.spec') }}
          restore-keys: ccache-

      - name: Build APK (buildozer)
        # LT_SYS_SYMBOL_USCORE (used by p4a's libffi recipe) ships in
        # /usr/share/aclocal/ltdl.m4, provided by the libltdl-dev package.
        # ACLOCAL_PATH just makes sure the system aclocal dirs are searched.
        #
        # PIP_CONSTRAINT points at a constraint FILE limiting pip to <26. p4a
        # force-upgrades pip with `pip install -U pip` during setup, and pip >= 26
        # removed `BuildDependencyInstallError` from pip._internal.exceptions,
        # which crashes the build with an ImportError. The env var propagates
        # into p4a's build venv (it inherits os.environ).
        #
        # ccache: p4a auto-wraps CC/CXX with ccache when it's on PATH.
        # CCACHE_COMPILERCHECK=content keys objects on compiler content rather
        # than mtime/size across toolchains, making the cache reusable.
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
          PIP_CONSTRAINT: /tmp/pip-constraints.txt
          CCACHE_COMPILERCHECK: content
          USE_CCACHE: '1'
        run: |
          printf 'pip<26\n' > /tmp/pip-constraints.txt
          yes | buildozer android debug

      - name: Smoke test APK
        run: |
          APK=$(find bin -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" \
            || { echo "APK missing classes.dex"; exit 1; }
          echo "APK smoke test passed: $(basename "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [validate, wheel, desktop, appimage, linux-tui, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}