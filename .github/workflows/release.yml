name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  wheel:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload wheel + sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  desktop:
    name: Windows binaries (TUI + GUI)
    needs: wheel
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TUI dependencies
        # Build the TUI first with only TUI deps installed. Installing .[gui]
        # would pull in kivy, whose PyInstaller hook initializes an OpenGL
        # context at build time and crashes headless Windows runners (GL 1.1).
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ".[tui]"

      - name: Build TUI binary (PyInstaller)
        run: pyinstaller --clean --noconfirm packaging/novelfetch-tui.spec

      - name: Install GUI dependencies
        run: pip install ".[gui]"

      - name: Build GUI binary (PyInstaller)
        # KIVY_UNITTEST=1 puts kivy in headless test mode and KIVY_NO_ARGS=1
        # keeps EventLoop's event list empty at import time, so no window/GL
        # context is created while collect_all("kivymd") imports kivymd in a
        # subprocess on the headless runner (which only has OpenGL 1.1).
        env:
          KIVY_UNITTEST: "1"
          KIVY_NO_ARGS: "1"
        run: pyinstaller --clean --noconfirm packaging/novelfetch-gui.spec

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.exe
          if-no-files-found: error

  appimage:
    name: Linux AppImage (GUI)
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # mksquashfs is required to package AppImages but is not present on
          # the default ubuntu-latest image. libcairo2-dev is needed to build
          # pycairo (a transitive dep of kivy) from source inside the AppDir.
          sudo apt-get install -y squashfs-tools file libfuse2 libcairo2-dev

      - name: Install python-appimage
        run: python -m pip install --upgrade pip python-appimage

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: wheel

      - name: Stage wheel into recipes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WHEEL=$(find wheel -name '*.whl' | head -1)
          for variant in tui gui; do
            mkdir -p "packaging/appimage/$variant"
            cp "$WHEEL" "packaging/appimage/$variant/"
            # python-appimage pip-installs from a temp dir, so reference the
            # wheel by absolute path; keep the PEP 427 filename (renaming would
            # make pip reject it). The [extra] pulls the variant dependencies.
            ABS="$(realpath "packaging/appimage/$variant/$(basename "$WHEEL")")"
            printf '%s[%s]\n' "$ABS" "$variant" > "packaging/appimage/$variant/requirements.txt"
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build GUI AppImage
        # python-appimage writes the resulting AppImage to the repo root (CWD),
        # named after the desktop file's Name= field (NovelFetch-x86_64.AppImage).
        run: APPIMAGE_EXTRACT_AND_RUN=1 python -m python_appimage build app -p 3.11 packaging/appimage/gui

      - name: Rename AppImage to versioned name
        run: |
          mkdir -p dist
          cp NovelFetch-*.AppImage "dist/novelfetch-gui-$VERSION.AppImage"
          ls -la dist

      - name: Upload AppImages
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  linux-tui:
    name: Linux TUI binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ".[tui]"

      - name: Build TUI binary (PyInstaller)
        run: pyinstaller --clean --noconfirm packaging/novelfetch-tui.spec

      - name: Rename binary for terminal invocation
        # Named so it can be run from the terminal by typing NovelFetchTUI.
        run: mv dist/novelfetch-tui "dist/NovelFetchTUI-$VERSION"

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-tui
          path: dist/NovelFetchTUI-*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            libtool-bin autoconf-archive libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev autopoint gettext

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.34

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (buildozer)
        # LT_SYS_SYMBOL_USCORE (used by p4a's libffi recipe) ships in
        # /usr/share/aclocal/ltdl.m4, provided by the libltdl-dev package.
        # ACLOCAL_PATH just makes sure the system aclocal dirs are searched.
        env:
          ACLOCAL_PATH: /usr/share/aclocal:/usr/local/share/aclocal
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: bin/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [wheel, desktop, appimage, linux-tui, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -la artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
