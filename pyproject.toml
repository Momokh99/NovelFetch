[build-system]
# setuptools>=77 is required for the PEP 639 `license`/`license-files` fields.
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelfetch"
version = "2.0.8"
description = "A novel fetching and reading application with TUI and Android (KivyMD) frontends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The sources/ modules use PEP 604 unions (`str | None`) in annotations that are
# evaluated at def time, so 3.9 raises TypeError on import. curl_cffi (tui extra)
# also needs >=3.10.
requires-python = ">=3.10"
authors = [
    { name = "Mohamed" },
]

# Application dependencies. The TUI is the primary frontend, so its
# dependencies are mandatory and `pip install novelfetch` yields a working
# terminal app. The KivyMD GUI stays opt-in behind the `gui` extra.
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.14.0",
    # Faster HTML parsing than the built-in html.parser (core.http_client
    # falls back to html.parser when it is unavailable, e.g. on Android).
    "lxml>=4.9.0",
    "deep-translator>=1.11.0",
    "EbookLib>=0.20",
    "textual>=8.0.0",
    # ~13 MB wheel, imported lazily by sources/scriblehub.py with an httpx
    # fallback. Mandatory here so ScribbleHub works out of the box rather than
    # silently degrading to a Cloudflare-blocked source.
    "curl_cffi>=0.15.0",
]

[project.optional-dependencies]
# GUI-specific dependencies (KivyMD desktop + Android)
gui = [
    "kivy>=2.3.0",
    "kivymd>=2.0.0",
    "arabic-reshaper",
    "python-bidi",
]
# Development dependencies
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "watchdog>=5.0",
]

[project.urls]
Repository = "https://github.com/Momokh99/NovelFetch"

[project.scripts]
novelfetch-tui = "tui.main:main"
novelfetch-gui = "gui.main:main"

[tool.setuptools.packages.find]
include = ["core*", "sources*", "tui*", "gui*"]

[tool.setuptools.package-data]
"gui" = ["*.kv", "kv/*.kv", "data/*.ttf", "data/*.png"]
"tui" = ["*.tcss"]

# ──────────────────────────────────────────────
# Tool configurations (all in one place)
# ──────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F841",   # local variable assigned but never used (common in Kivy patterns)
]

[tool.ruff.lint.per-file-ignores]
"gui/**" = ["F811"]  # redefinition of unused names (Kivy KV includes)
"**/__init__.py" = ["F401"]  # imports here are deliberate re-exports

[tool.ruff.lint.isort]
known-first-party = ["core", "sources", "tui", "gui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # Kivy/KivyMD stubs are incomplete
exclude = [".buildozer/", "venv/"]
